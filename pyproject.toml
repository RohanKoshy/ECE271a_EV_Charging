[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "evopt"
version = "0.1.0"
description = "Modular EV fleet charging optimization: uncertain demand, demand charge, overcurrent limit"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
evopt = ["viz/*.mplstyle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
